[package]
name = "tokenizer-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenizer-proto = { path = "../tokenizer-proto" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1"
futures = "0.3"
serde_json = "1"

[[bin]]
name = "rust_client"
path = "src/bin/rust_client.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "bench_runner"
path = "tests/bench_runner.rs"

[[test]]
name = "template_branches"
path = "tests/template_branches.rs"
