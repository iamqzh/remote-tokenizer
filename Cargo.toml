[workspace]
resolver = "2"
members = [
    "crates/tokenizer-core",
    "crates/tokenizer-proto",
    "crates/tokenizer-server",
    "crates/tokenizer-tests",
    "crates/tokenizer-manifest",
    "tools/archive-model",
    "tools/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
dashmap = "6"

tokenizers = "0.22"
tiktoken-rs = "0.7"
minijinja = "2.0"
hf-hub = { version = "0.4", features = ["tokio"] }
